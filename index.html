<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Where's the Ground?</title>
    <link rel="stylesheet" href="style.css?v=clear-touch" />
    <script type="module" src="src/game.js?v=mobile-sharp"></script>
  </head>
  <body class="loading">
    <div id="loading-screen" role="status" aria-live="polite">
      <div id="loading-label">Carregando vídeo</div>
      <div class="loading-track" role="progressbar" aria-label="Carregamento do vídeo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-fill"></div></div>
    </div>
    <video id="opening-video" playsinline preload="none" aria-label="Vídeo de abertura"></video>
    <canvas id="game" aria-label="Jogo de plataforma"></canvas>
    <section id="command-console" role="dialog" aria-label="Console de comandos" hidden>
      <form>
        <label for="command-input">COMANDO / F7</label>
        <input id="command-input" type="text" placeholder="delegacia" autocomplete="off" spellcheck="false" />
        <div role="status">delegacia → interior</div>
      </form>
    </section>

    <div class="hud" aria-live="polite">
      <div class="fuel-track" aria-label="Combustível"><div id="fuel-fill"></div></div>
      <span id="fuel-label">100%</span>
      <span id="reserve-label" hidden>RESERVA: PRONTA</span>
    </div>
    <div class="controls-hint">A/D MOVER · ESPAÇO PULAR / BOOST ↑ · SHIFT DASH → · SHIFT + ESPAÇO MEGA-BOOST · J RAJADA · T DIÁLOGO · C CRT · H INTRO</div>

    <div id="crt-overlay" aria-hidden="true"></div>

    <div class="touch-controls" aria-label="Controles de toque">
      <div>
        <button type="button" data-key="left" aria-label="Andar para a esquerda"><svg aria-hidden="true" viewBox="0 0 9 9"><path d="M3 1h1v1H3zM2 2h2v1H2zM1 3h3v1H1zM0 4h8v1H0zM1 5h3v1H1zM2 6h2v1H2zM3 7h1v1H3z"/></svg></button>
        <button type="button" data-key="right" aria-label="Andar para a direita"><svg aria-hidden="true" viewBox="0 0 9 9"><path d="M3 1h1v1H3zM2 2h2v1H2zM1 3h3v1H1zM0 4h8v1H0zM1 5h3v1H1zM2 6h2v1H2zM3 7h1v1H3z"/></svg></button>
      </div>
      <div>
        <button type="button" data-key="jump" aria-label="Pular, segurar para boost"><svg aria-hidden="true" viewBox="0 0 9 9"><path d="M4 0h1v1H4zM3 1h3v1H3zM2 2h5v1H2zM1 3h7v1H1zM4 4h1v5H4z"/></svg></button>
        <button type="button" data-key="dash" aria-label="Dash para a frente"><svg aria-hidden="true" viewBox="0 0 9 9"><path d="M1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM3 5h1v1H3zM2 6h1v1H2zM1 7h1v1H1zM5 1h1v1H5zM6 2h1v1H6zM7 3h1v1H7zM8 4h1v1H8zM7 5h1v1H7zM6 6h1v1H6zM5 7h1v1H5z"/></svg></button>
        <button type="button" data-key="blast" aria-label="Disparar rajada"><svg aria-hidden="true" viewBox="0 0 9 9"><path d="M4 0h1v2H4zM1 1h1v1H1zM7 1h1v1H7zM0 4h2v1H0zM7 4h2v1H7zM3 3h3v3H3zM1 7h1v1H1zM7 7h1v1H7zM4 7h1v2H4z"/></svg></button>
        <button type="button" data-key="interact" aria-label="Falar com personagem"><svg aria-hidden="true" viewBox="0 0 12 10"><path d="M1 0h10v1H1zM0 1h1v6H0zM11 1h1v6h-1zM1 7h4v1H1zM5 8h1v1H5zM6 7h5v1H6zM2 3h2v2H2zM5 3h2v2H5zM8 3h2v2H8z"/></svg><span>FALAR</span></button>
      </div>
    </div>
  </body>
</html>
